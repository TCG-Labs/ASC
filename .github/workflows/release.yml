name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

jobs:
  validate:
    name: Validate Release
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Validate tag format
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "📦 Validating tag: $TAG"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format: $TAG"
            echo "Expected semantic versioning format: v1.0.0, v2.1.3, etc."
            exit 1
          fi

          echo "✅ Valid tag format"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build release configuration
        run: swift build -c release -v

      - name: Run tests with coverage
        run: swift test -v --enable-code-coverage

      - name: Verify coverage threshold
        run: |
          # Find paths automatically
          XCTEST_PATH=$(find .build -name "ASCPackageTests.xctest" -type d | head -1)
          PROFDATA_PATH=$(find .build -name "default.profdata" | head -1)

          if [ -z "$XCTEST_PATH" ] || [ -z "$PROFDATA_PATH" ]; then
            echo "⚠️  Could not verify coverage (test bundle not found)"
            exit 0
          fi

          COVERAGE=$(xcrun llvm-cov report \
            "$XCTEST_PATH/Contents/MacOS/ASCPackageTests" \
            -instr-profile "$PROFDATA_PATH" \
            Sources/ASC/ | tail -1 | awk '{print $10}' | sed 's/%//')

          echo "📊 Code Coverage: ${COVERAGE}%"

          if (( $(echo "$COVERAGE < 70.0" | bc -l) )); then
            echo "❌ Cannot release with coverage below 70% threshold"
            exit 1
          fi

          echo "✅ Coverage meets release requirements"

  create-release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## ASC v${{ steps.version.outputs.VERSION }}

            ### Installation

            Add this to your `Package.swift`:

            ```swift
            dependencies: [
                .package(url: "https://github.com/${{ github.repository }}.git", from: "${{ steps.version.outputs.VERSION }}")
            ]
            ```

            ### Requirements

            - iOS 18.0+
            - macOS 15.0+
            - Swift 6.2+
            - Xcode 16.0+

            ### What's Changed

            See below for detailed changelog.

  notify-swift-package-index:
    name: Notify Swift Package Index
    needs: create-release
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Ping Swift Package Index
        run: |
          echo "Swift Package Index will automatically index this release within 24 hours"
          echo "To add your package to the index, visit: https://swiftpackageindex.com/add-a-package"
