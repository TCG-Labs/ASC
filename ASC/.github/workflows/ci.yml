# Swift CI Workflow
# Improved version combining our custom setup with GitHub best practices
# For more information: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel in-progress workflows when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v
        # Note: SwiftLint runs automatically as a build plugin during this step

      - name: Run tests
        run: swift test -v --enable-code-coverage

      - name: Generate code coverage and verify threshold
        run: |
          # Find paths automatically to handle different architectures
          XCTEST_PATH=$(find .build -name "ASCPackageTests.xctest" -type d | head -1)
          PROFDATA_PATH=$(find .build -name "default.profdata" | head -1)

          if [ -z "$XCTEST_PATH" ] || [ -z "$PROFDATA_PATH" ]; then
            echo "❌ Could not find test bundle or profdata"
            exit 1
          fi

          echo "📦 Using test bundle: $XCTEST_PATH"
          echo "📊 Using profile data: $PROFDATA_PATH"

          # Generate lcov format for Codecov
          xcrun llvm-cov export -format="lcov" \
            "$XCTEST_PATH/Contents/MacOS/ASCPackageTests" \
            -instr-profile "$PROFDATA_PATH" > coverage.lcov

          # Check coverage threshold (70% minimum)
          COVERAGE=$(xcrun llvm-cov report \
            "$XCTEST_PATH/Contents/MacOS/ASCPackageTests" \
            -instr-profile "$PROFDATA_PATH" \
            Sources/ASC/ | tail -1 | awk '{print $10}' | sed 's/%//')

          echo "📊 Code Coverage: ${COVERAGE}%"

          # Verify coverage meets threshold
          if (( $(echo "$COVERAGE < 70.0" | bc -l) )); then
            echo "❌ Coverage is below 70% threshold!"
            exit 1
          else
            echo "✅ Coverage meets 70% threshold"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.lcov
          fail_ci_if_error: false
        continue-on-error: true
